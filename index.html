<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Taller 2 – CSS3 | UFPS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- EJERCICIO 1: Menú horizontal (Flexbox) -->
  <nav class="menu-flex">
    <div class="brand">UFPS</div>
    <ul>
      <li><a href="#" class="active">Inicio</a></li>
      <li><a href="#">Cursos</a></li>
      <li><a href="#">Proyectos</a></li>
      <li><a href="#">Recursos</a></li>
      <li><a href="#">Contacto</a></li>
    </ul>
    <button class="cta-btn">Ingresar</button>
  </nav>

  <!-- EJERCICIO 2: Galería con Grid -->
  <section class="galeria">
    <h2>Galería</h2>
    <div class="gallery-grid">
      <div class="gallery-item">Foto 1</div>
      <div class="gallery-item">Foto 2</div>
      <div class="gallery-item">Foto 3</div>
      <div class="gallery-item">Foto 4</div>
      <div class="gallery-item">Foto 5</div>
      <div class="gallery-item">Foto 6</div>
    </div>
  </section>

  <!-- EJERCICIO 3: Hover en botones -->
  <section class="botones">
    <h2>Botones</h2>
    <div class="btn-group">
      <button class="btn btn-solid">Sólido</button>
      <button class="btn btn-outline">Contorno</button>
      <button class="btn btn-slide">Deslizante</button>
    </div>
  </section>

  <!-- EJERCICIO 4: Diseño Responsive -->
  <section class="layout">
    <header class="ld-header">Header</header>
    <div class="contenedor-principal">
      <aside class="ld-aside">Aside</aside>
      <main class="ld-main">Main Content</main>
    </div>
    <footer class="ld-footer">Footer</footer>
  </section>

</body>
</html>
